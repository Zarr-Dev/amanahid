[build]
  command = "npm run build"
  publish = "public"

[build.environment]
  NODE_VERSION = "24"

# Keep the static UI on Netlify while forwarding API requests to the existing Vercel backend.
[[redirects]]
  from = "/api/*"
  to = "https://amanahids.vercel.app/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api"
  to = "https://amanahids.vercel.app/api"
  status = 200
  force = true
