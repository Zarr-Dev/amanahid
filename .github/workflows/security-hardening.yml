name: Security hardening checks

on:
  push:
    branches:
      - main
      - "hardening/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: amanahid-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, tests and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Run build validation and automated tests
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Package clean source archive for VS Code
        run: git archive --format=zip --prefix=amanahid/ --output=amanahid-vscode-source.zip HEAD

      - name: Upload VS Code source archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: amanahid-vscode-source
          path: amanahid-vscode-source.zip
          if-no-files-found: error
          retention-days: 7
