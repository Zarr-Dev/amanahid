<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Amanah.id | Not Found</title>
    <style>
      :root {
        --bg: #05070c;
        --panel: rgba(255, 255, 255, 0.02);
        --text: rgba(255,255,255,0.9);
        --muted: rgba(255,255,255,0.7);
        --accent: #4f7ef7;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        min-height: 100%;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      .not-found {
        width: min(90vw, 540px);
        text-align: center;
        padding: 2rem 1.5rem 3rem;
      }
      h1 {
        margin: 0 0 1rem;
        font-size: clamp(1.9rem, 2.5vw, 2.6rem);
        font-weight: 600;
        letter-spacing: 0.02em;
      }
      p {
        margin: 0 auto 1.5rem;
        max-width: 32ch;
        color: var(--muted);
        font-size: clamp(1rem, 1.2vw, 1.2rem);
        line-height: 1.6;
      }
      .code {
        margin: 0.5rem 0 1.5rem;
        font-size: 0.8rem;
        letter-spacing: 0.2em;
        color: rgba(255,255,255,0.9);
      }
      .meta {
        margin-top: 2rem;
        font-size: 0.72rem;
        letter-spacing: 0.2em;
        color: rgba(255,255,255,0.7);
      }
      a {
        display: inline-block;
        margin-top: 0.75rem;
        color: var(--text);
        text-decoration: none;
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 999px;
        padding: 0.75rem 1.2rem;
        background: rgba(255,255,255,0.03);
      }
      a:hover {
        border-color: rgba(79,126,247,0.8);
        box-shadow: 0 0 0 1px rgba(79,126,247,0.5);
      }
    </style>
  </head>
  <body>
    <main class="not-found" aria-live="polite">
      <h1>This page doesn't exist</h1>
      <p>It may have been moved, removed, or never existed.</p>
      <div class="code">404 NOT_FOUND</div>
      <a href="/">Back to homepage</a>
      <div class="meta">VIEW DOCUMENTATION / COPY DEBUG PROMPT</div>
    </main>
  </body>
</html>
